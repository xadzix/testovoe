[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
addopts = "--strict-config --strict-markers -ra"
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.ruff]
extend-exclude = ["backend/**/migrations"]
line-length = 100
src = ["backend"]
target-version = "py312"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["ANN", "B", "DJ", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"backend/config/settings/*.py" = ["F403", "F405"]

