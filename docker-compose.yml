services:
  db:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-purchase_requests}
      POSTGRES_USER: ${POSTGRES_USER:-purchase_requests}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-purchase_requests}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.4.11-alpine
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build:
      context: .
    image: purchase-request-import:dev
    command: python manage.py runserver 0.0.0.0:8000
    working_dir: /app/backend
    init: true
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-unsafe-local-development-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      POSTGRES_DB: ${POSTGRES_DB:-purchase_requests}
      POSTGRES_USER: ${POSTGRES_USER:-purchase_requests}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-purchase_requests}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      IMPORT_STORAGE_ROOT: /app/imports
      IMPORT_BATCH_SIZE: ${IMPORT_BATCH_SIZE:-500}
      IMPORT_LEASE_TIMEOUT_SECONDS: ${IMPORT_LEASE_TIMEOUT_SECONDS:-300}
      IMPORT_MAX_FILE_SIZE_BYTES: ${IMPORT_MAX_FILE_SIZE_BYTES:-104857600}
      XLSX_MAX_ARCHIVE_ENTRIES: ${XLSX_MAX_ARCHIVE_ENTRIES:-10000}
      XLSX_MAX_UNCOMPRESSED_SIZE_BYTES: ${XLSX_MAX_UNCOMPRESSED_SIZE_BYTES:-1073741824}
      XLSX_MAX_PART_SIZE_BYTES: ${XLSX_MAX_PART_SIZE_BYTES:-536870912}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - import_files:/app/imports

  worker:
    build:
      context: .
    image: purchase-request-import:dev
    command: celery -A config worker --loglevel=INFO
    working_dir: /app/backend
    init: true
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-unsafe-local-development-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      POSTGRES_DB: ${POSTGRES_DB:-purchase_requests}
      POSTGRES_USER: ${POSTGRES_USER:-purchase_requests}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-purchase_requests}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      IMPORT_STORAGE_ROOT: /app/imports
      IMPORT_BATCH_SIZE: ${IMPORT_BATCH_SIZE:-500}
      IMPORT_LEASE_TIMEOUT_SECONDS: ${IMPORT_LEASE_TIMEOUT_SECONDS:-300}
      IMPORT_MAX_FILE_SIZE_BYTES: ${IMPORT_MAX_FILE_SIZE_BYTES:-104857600}
      XLSX_MAX_ARCHIVE_ENTRIES: ${XLSX_MAX_ARCHIVE_ENTRIES:-10000}
      XLSX_MAX_UNCOMPRESSED_SIZE_BYTES: ${XLSX_MAX_UNCOMPRESSED_SIZE_BYTES:-1073741824}
      XLSX_MAX_PART_SIZE_BYTES: ${XLSX_MAX_PART_SIZE_BYTES:-536870912}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - import_files:/app/imports

volumes:
  postgres_data:
  import_files:
